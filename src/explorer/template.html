<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bathynaut — Deep-Sea Knowledge Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-abyss: #030712;
      --bg-panel: rgba(17, 24, 39, 0.85);
      --border-panel: rgba(55, 65, 81, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --sunlight: #38bdf8;
      --twilight: #818cf8;
      --abyssal: #fbbf24;
      --node-adr: #f59e0b;
      --node-func: #38bdf8;
      --node-class: #a855f7;
      --node-file: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-abyss);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-panel);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #search-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-panel);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      width: 220px;
      font-size: 0.85rem;
    }
    #stats-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    #graph-container {
      width: 100%;
      height: 100%;
    }
    #side-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 360px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-panel);
      border-radius: 16px;
      padding: 24px;
      z-index: 10;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    #side-panel.open { display: flex; }
    #close-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: none;
      font-size: 1.2rem;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge.sunlight { background: rgba(56, 189, 248, 0.2); color: var(--sunlight); }
    .badge.twilight { background: rgba(129, 140, 248, 0.2); color: var(--twilight); }
    .badge.abyssal { background: rgba(251, 191, 36, 0.2); color: var(--abyssal); }
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.75rem;
      display: flex;
      gap: 16px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="header">
    <h1>🌊 Bathynaut</h1>
    <input type="text" id="search-box" placeholder="Filtrar funcoes, classes ou ADRs...">
    <div id="stats-badge"><span id="node-count">0</span> nos • <span id="edge-count">0</span> arestas</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot" style="background: var(--node-adr)"></div> ADR / Causal</div>
    <div class="legend-item"><div class="dot" style="background: var(--node-func)"></div> Funcao</div>
    <div class="legend-item"><div class="dot" style="background: var(--node-class)"></div> Classe</div>
    <div class="legend-item"><div class="dot" style="background: var(--node-file)"></div> Arquivo</div>
  </div>

  <div id="side-panel">
    <button id="close-panel">&times;</button>
    <div id="panel-content"></div>
  </div>

  <svg id="graph-container"></svg>

  <script>
    const DATA = /*__BATHYNAUT_DATA__*/ { nodes: [], edges: [] };

    document.getElementById('node-count').textContent = DATA.nodes.length;
    document.getElementById('edge-count').textContent = DATA.edges.length;

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph-container")
      .attr("viewBox", [0, 0, width, height]);

    const g = svg.append("g");

    svg.call(d3.zoom()
      .extent([[0, 0], [width, height]])
      .scaleExtent([0.1, 8])
      .on("zoom", ({ transform }) => g.attr("transform", transform)));

    const nodeColor = d => {
      if (d.kind === 'adr' || d.kind === 'incident') return '#f59e0b';
      if (d.kind === 'function') return '#38bdf8';
      if (d.kind === 'class') return '#a855f7';
      return '#6b7280';
    };

    const simulation = d3.forceSimulation(DATA.nodes)
      .force("link", d3.forceLink(DATA.edges).id(d => d.id).distance(60))
      .force("charge", d3.forceManyBody().strength(-180))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("y", d3.forceY(d => {
        if (d.depth_zone === 'sunlight') return height * 0.25;
        if (d.depth_zone === 'twilight') return height * 0.50;
        return height * 0.75; // abyssal at bottom
      }).strength(0.3));

    const link = g.append("g")
      .attr("stroke", "rgba(75, 85, 99, 0.4)")
      .attr("stroke-width", 1.2)
      .selectAll("line")
      .data(DATA.edges)
      .join("line");

    const node = g.append("g")
      .selectAll("g")
      .data(DATA.nodes)
      .join("g")
      .call(d3.drag()
        .on("start", (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        }))
      .on("click", (event, d) => showDetails(d));

    node.append("circle")
      .attr("r", d => {
        const base = d.kind === 'adr' || d.kind === 'incident' ? 9 : (d.kind === 'class' ? 8 : 6);
        const prBoost = Math.min(8, (d.pagerank_score || 0) * 20);
        return base + prBoost;
      })
      .attr("fill", nodeColor)
      .attr("stroke", d => d.is_bridge ? "#fbbf24" : "#fff")
      .attr("stroke-width", d => d.is_bridge ? 2 : 1)
      .attr("style", "filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.5)); cursor: pointer;");

    node.append("text")
      .text(d => d.name)
      .attr("x", 10)
      .attr("y", 3)
      .attr("fill", "#e5e7eb")
      .attr("font-size", "10px")
      .attr("pointer-events", "none");

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function showDetails(d) {
      const panel = document.getElementById('side-panel');
      const content = document.getElementById('panel-content');
      panel.classList.add('open');

      let invariantsHtml = '';
      try {
        const invs = JSON.parse(d.invariants_json || '[]');
        if (invs.length > 0) {
          invariantsHtml = `<div style="margin-bottom: 12px; font-size: 0.8rem; color: #fbbf24;"><strong>Invariantes (${d.enforcement || 'advisory'}):</strong><ul style="padding-left: 16px; margin-top: 4px;">${invs.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
        }
      } catch {}

      const excerptBlock = d.body_markdown || d.code_excerpt || '';

      content.innerHTML = `
        <span class="badge ${d.depth_zone}">${d.depth_zone} • ${d.kind}${d.is_bridge ? ' • BRIDGE' : ''}</span>
        <h2 style="font-size: 1.2rem; margin-bottom: 8px;">${d.name}</h2>
        ${d.signature ? `<code style="display:block; background: rgba(0,0,0,0.4); padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; color: #38bdf8; margin-bottom: 10px;">${d.signature}</code>` : ''}
        <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px;">${d.summary || 'Sem resumo.'}</p>
        ${d.file_path ? `<div style="font-size: 0.75rem; color: #6b7280; margin-bottom: 12px;">📄 ${d.file_path}${d.line_start ? `:${d.line_start}-${d.line_end || d.line_start}` : ''}</div>` : ''}
        ${invariantsHtml}
        ${excerptBlock ? `<div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-size: 0.8rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto; font-family: monospace;">${excerptBlock}</div>` : ''}
      `;
    }

    document.getElementById('close-panel').onclick = () => {
      document.getElementById('side-panel').classList.remove('open');
    };

    document.getElementById('search-box').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      node.style('opacity', d => {
        if (!q) return 1;
        return (d.name.toLowerCase().includes(q) || d.id.toLowerCase().includes(q)) ? 1 : 0.15;
      });
    });
  </script>
</body>
</html>
